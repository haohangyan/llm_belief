[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-belief"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gilda>=1.3",
    "indra>=1.22",
    "indra_db>=0.0.1",
    "openai>=1.0",
    "tqdm>=4.0",
]

[tool.setuptools]
packages = ["llm_belief"]
